# 自動更新＋部署
# - 每 4 小時抓一次新聞、作品、影片、獎項、音樂節目一位、照片、粉絲投稿
# - push 到 main、手動執行、投稿被標上 approved 時也會立刻跑
# - 資料有變化才 commit（data/auto.json），然後部署到 GitHub Pages
name: Auto update & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  issues:
    types: [labeled, unlabeled, edited, closed, reopened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'approved') || github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 抓取最新資料
        run: node scripts/update.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 有變化就 commit
        run: |
          if git diff --quiet -- data; then
            echo "資料沒有變化"
          else
            git config user.name "mintguesss"
            git config user.email "184753416+mintguesss@users.noreply.github.com"
            git add data
            git commit -m "Auto-update data"
            git pull --rebase --quiet || true
            git push
          fi

      - name: 產生分享預覽頁
        run: node scripts/build-share.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub 偶爾在上傳後幾秒內還查不到 artifact（服務端延遲），先等一下，失敗再重試一次
      - name: 等待 artifact 就緒
        run: sleep 15

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 部署失敗，1 分鐘後重試
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
